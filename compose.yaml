services:
  dynamodb-data-init:
    # The pinned image runs DynamoDB as UID/GID 1000. Initialize only its volume.
    image: amazon/dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown 1000:1000 /data && chmod 750 /data"]
    volumes:
      - dynamodb-data:/data
    restart: "no"

  dynamodb:
    image: amazon/dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    working_dir: /home/dynamodblocal
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    depends_on:
      dynamodb-data-init:
        condition: service_completed_successfully

volumes:
  dynamodb-data:
